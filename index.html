<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 설문조사</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f4f6f8;
      color: #222;
      line-height: 1.6;
    }
    .container {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
    }
    header, .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 28px 28px;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    header p { margin: 0; color: #666; }
    .question { font-weight: 600; margin-bottom: 10px; }
    .question span.req { color: #d93025; margin-left: 4px; }
    .option { display: block; padding: 8px 0; cursor: pointer; }
    .option input { margin-right: 8px; }
    textarea, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd2d8;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 96px; resize: vertical; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { background: #9bb8f0; cursor: default; }
    .done { text-align: center; padding: 40px 20px; }
    .hidden { display: none; }
    .error { color: #d93025; font-size: 14px; margin-top: 8px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>고객 설문조사</h1>
      <p>약 1분 정도 소요됩니다. 여러분의 의견은 서비스 개선에 큰 도움이 됩니다.</p>
    </header>

    <form id="survey-form" class="card">
      <div class="card">
        <div class="question">1. 현재 이용 중인 서비스에 대해 얼마나 만족하시나요?<span class="req">*</span></div>
        <label class="option"><input type="radio" name="q1" value="5" required> 매우 만족</label>
        <label class="option"><input type="radio" name="q1" value="4"> 만족</label>
        <label class="option"><input type="radio" name="q1" value="3"> 보통</label>
        <label class="option"><input type="radio" name="q1" value="2"> 불만족</label>
        <label class="option"><input type="radio" name="q1" value="1"> 매우 불만족</label>
      </div>

      <div class="card">
        <div class="question">2. 이 서비스를 지인에게 추천하실 가능성은 어느 정도인가요?<span class="req">*</span></div>
        <label class="option"><input type="radio" name="q2" value="10" required> 10 (매우 추천)</label>
        <label class="option"><input type="radio" name="q2" value="7"> 7</label>
        <label class="option"><input type="radio" name="q2" value="5"> 5</label>
        <label class="option"><input type="radio" name="q2" value="3"> 3</label>
        <label class="option"><input type="radio" name="q2" value="0"> 0 (추천 안 함)</label>
      </div>

      <div class="card">
        <div class="question">3. 서비스 개선을 위해 가장 필요한 점은 무엇인가요?</div>
        <textarea name="q3" placeholder="자유롭게 적어주세요"></textarea>
      </div>

      <div class="card">
        <div class="question">4. 연락처 (선택, 답변 확인이 필요한 경우에만 사용됩니다)</div>
        <input type="text" name="contact" placeholder="이메일 또는 전화번호">
      </div>

      <button type="submit" id="submit-btn">제출하기</button>
      <div class="error" id="error"></div>
    </form>

    <div id="thanks" class="card done hidden">
      <h1>응답해 주셔서 감사합니다!</h1>
      <p>소중한 의견을 잘 반영하겠습니다.</p>
    </div>
  </div>

  <script>
    // 응답 수집 엔드포인트. Google Forms 또는 Formspree 등의 제출 URL을 아래에 넣으면 실제 응답이 저장됩니다.
    // 비워두면 제출 화면만 보여주고 응답은 저장되지 않습니다.
    const SUBMIT_ENDPOINT = "";

    const form = document.getElementById("survey-form");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const btn = document.getElementById("submit-btn");
      const data = new FormData(form);

      if (SUBMIT_ENDPOINT) {
        btn.disabled = true;
        btn.textContent = "제출 중...";
        try {
          const res = await fetch(SUBMIT_ENDPOINT, {
            method: "POST",
            body: data,
            headers: { "Accept": "application/json" }
          });
          if (!res.ok) throw new Error("status " + res.status);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "제출하기";
          errorEl.textContent = "제출에 실패했어요. 잠시 후 다시 시도해 주세요.";
          return;
        }
      }

      form.classList.add("hidden");
      document.getElementById("thanks").classList.remove("hidden");
    });
  </script>
</body>
</html>
