<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아정당 알뜰폰 해지고객 설문</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #ffffff;
      color: #111;
      line-height: 1.6;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100%;
      padding: 28px 22px 32px;
      display: flex;
      flex-direction: column;
    }
    .brand { text-align: center; margin-top: 8px; }
    .brand img { max-width: 220px; height: auto; }
    .brand .title { font-size: 22px; font-weight: 700; margin: 12px 0 4px; }
    .brand .desc { color: #666; font-size: 15px; margin: 0; }

    .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 28px; }
    .back {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: #e5e7eb; color: #555;
      font-size: 20px; line-height: 1; cursor: pointer; flex: 0 0 auto; padding: 0;
    }
    .back:disabled { opacity: .4; cursor: default; }
    .bar { flex: 1; height: 10px; background: #eceef2; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #145ce6; transition: width .25s ease; }
    .count { text-align: right; color: #9aa0a6; font-size: 13px; margin-top: 6px; }

    form { flex: 1; display: flex; flex-direction: column; }
    .step { display: none; flex: 1; flex-direction: column; padding-top: 36px; }
    .step.active { display: flex; }
    .qno { text-align: center; color: #145ce6; font-size: 34px; font-weight: 500; position: relative; }
    .qno .req { position: absolute; top: -6px; font-size: 16px; margin-left: -10px; }
    .qtext { text-align: center; font-size: 19px; font-weight: 500; margin: 18px 0 28px; word-break: keep-all; }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #c9d6f5;
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
      color: #111;
      background: #fff;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #145ce6; }
    textarea { min-height: 140px; resize: vertical; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border: 1px solid #dfe3ea; border-radius: 10px;
      cursor: pointer; font-size: 16px;
    }
    .opt input { accent-color: #145ce6; width: 18px; height: 18px; margin: 0; }
    .opt:has(input:checked) { border-color: #145ce6; background: #f3f7ff; }
    .other-input { margin-top: 10px; display: none; }
    .other-input.show { display: block; }

    .error { color: #d93025; font-size: 14px; text-align: center; min-height: 22px; margin-top: 12px; }
    .hint { color: #9aa0a6; font-size: 13px; text-align: right; margin-top: 6px; }

    .next {
      margin-top: 18px;
      background: #145ce6; color: #fff; border: none; border-radius: 12px;
      padding: 16px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 16px rgba(20, 92, 230, .25);
    }
    .next:disabled { opacity: .6; cursor: default; }

    .done { display: none; text-align: center; padding: 60px 10px; flex: 1; flex-direction: column; justify-content: center; }
    .done.show { display: flex; }
    .done h2 { font-size: 22px; margin: 0 0 12px; }
    .done p { color: #555; margin: 0; }
    .footer { text-align: center; color: #9aa0a6; font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brand" id="intro">
      <img src="https://ddstatic.net/1794815576916-9294461.png" alt="알뜰폰 해지 고객 설문">
      <p class="title">아정당 알뜰폰<br>해지고객 설문</p>
      <p class="desc">고객님의 소중한 의견 부탁드립니다</p>
    </header>

    <div class="progress-row">
      <button type="button" class="back" id="back" aria-label="이전 문항">&#8249;</button>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="count" id="count"></div>

    <form id="survey" novalidate>
      <!-- Q1: 단답형 (필수) -->
      <section class="step" data-step="0">
        <div class="qno"><span class="req">*</span>Q1.</div>
        <p class="qtext">어떤 통신사로 이동하셨나요?</p>
        <input type="text" name="q1" id="q1" placeholder="텍스트를 입력해 주세요." autocomplete="off">
      </section>

      <!-- Q2: 단일 선택 + 기타 직접 입력 (필수) -->
      <section class="step" data-step="1">
        <div class="qno"><span class="req">*</span>Q2.</div>
        <p class="qtext">아정당 알뜰폰을 해지하신 가장 큰 이유는 무엇인가요?</p>
        <div class="options">
          <label class="opt"><input type="radio" name="q2" value="이용요금 부담"><span>이용요금 부담</span></label>
          <label class="opt"><input type="radio" name="q2" value="타사 대비 혜택 부족"><span>타사 대비 혜택 부족</span></label>
          <label class="opt"><input type="radio" name="q2" value="데이터·통화·문자 제공량 부족"><span>데이터·통화·문자 제공량 부족</span></label>
          <label class="opt"><input type="radio" name="q2" value="고객센터 이용 불편"><span>고객센터 이용 불편</span></label>
          <label class="opt"><input type="radio" name="q2" value="휴대폰 구매·결합"><span>휴대폰 구매·결합</span></label>
          <label class="opt"><input type="radio" name="q2" value="기타"><span>기타</span></label>
        </div>
        <input type="text" name="q2_other" id="q2_other" class="other-input" placeholder="기타 내용을 입력해 주세요." autocomplete="off">
      </section>

      <!-- Q3: 장문형 5~100자 (필수) -->
      <section class="step" data-step="2">
        <div class="qno"><span class="req">*</span>Q3.</div>
        <p class="qtext">선택하신 이유와 관련해 가장 아쉬웠던 점을 구체적으로 알려주세요.</p>
        <textarea name="q3" id="q3" maxlength="100" placeholder="텍스트를 입력해 주세요."></textarea>
        <div class="hint"><span id="q3count">0</span> / 100자 (5자 이상)</div>
      </section>

      <div class="error" id="error"></div>
      <button type="submit" class="next" id="next">다음</button>
    </form>

    <section class="done" id="done">
      <h2>소중한 의견 감사합니다</h2>
      <p>보내주신 의견은 서비스 개선에 활용하겠습니다.</p>
    </section>

    <div class="footer">made for 아정당 알뜰폰</div>
  </div>

  <script>
    // 응답 수집 엔드포인트. Google Forms 또는 Formspree 등의 제출 URL을 넣으면 실제 응답이 저장됩니다.
    // 비워두면 제출 화면만 보여주고 응답은 저장되지 않습니다.
    const SUBMIT_ENDPOINT = "";

    const TOTAL = 3;
    let step = 0;

    const form = document.getElementById("survey");
    const steps = Array.from(form.querySelectorAll(".step"));
    const nextBtn = document.getElementById("next");
    const backBtn = document.getElementById("back");
    const fill = document.getElementById("fill");
    const count = document.getElementById("count");
    const errorEl = document.getElementById("error");
    const q2Other = document.getElementById("q2_other");
    const q3 = document.getElementById("q3");
    const q3count = document.getElementById("q3count");

    // 기타 선택 시에만 직접 입력란 표시
    form.querySelectorAll('input[name="q2"]').forEach((r) => {
      r.addEventListener("change", () => {
        q2Other.classList.toggle("show", r.value === "기타" && r.checked);
        errorEl.textContent = "";
      });
    });
    q3.addEventListener("input", () => {
      q3count.textContent = q3.value.length;
      errorEl.textContent = "";
    });
    document.getElementById("q1").addEventListener("input", () => { errorEl.textContent = ""; });

    function render() {
      steps.forEach((s, i) => s.classList.toggle("active", i === step));
      fill.style.width = ((step + 1) / TOTAL * 100) + "%";
      count.textContent = (step + 1) + "/" + TOTAL;
      backBtn.disabled = step === 0;
      nextBtn.textContent = step === TOTAL - 1 ? "제출하기" : "다음";
      errorEl.textContent = "";
      const focusEl = steps[step].querySelector("input[type=text], textarea");
      if (focusEl) setTimeout(() => focusEl.focus(), 50);
    }

    // 현재 문항 검증. 통과하면 true
    function validate() {
      if (step === 0) {
        if (!document.getElementById("q1").value.trim()) { errorEl.textContent = "답변을 입력해 주세요."; return false; }
      }
      if (step === 1) {
        if (!form.querySelector('input[name="q2"]:checked')) { errorEl.textContent = "하나를 선택해 주세요."; return false; }
      }
      if (step === 2) {
        const v = q3.value.trim();
        if (!v) { errorEl.textContent = "답변을 입력해 주세요."; return false; }
        if (v.length < 5) { errorEl.textContent = "5자 이상 입력해 주세요."; return false; }
        if (v.length > 100) { errorEl.textContent = "100자 이하로 입력해 주세요."; return false; }
      }
      return true;
    }

    backBtn.addEventListener("click", () => {
      if (step > 0) { step--; render(); }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!validate()) return;

      if (step < TOTAL - 1) {
        step++;
        render();
        return;
      }

      // 마지막 문항 제출
      nextBtn.disabled = true;
      nextBtn.textContent = "제출 중...";

      if (SUBMIT_ENDPOINT) {
        try {
          const res = await fetch(SUBMIT_ENDPOINT, {
            method: "POST",
            body: new FormData(form),
            headers: { "Accept": "application/json" }
          });
          if (!res.ok) throw new Error("status " + res.status);
        } catch (err) {
          nextBtn.disabled = false;
          nextBtn.textContent = "제출하기";
          errorEl.textContent = "제출에 실패했어요. 잠시 후 다시 시도해 주세요.";
          return;
        }
      }

      form.style.display = "none";
      document.querySelector(".progress-row").style.display = "none";
      count.style.display = "none";
      document.getElementById("intro").style.display = "none";
      document.getElementById("done").classList.add("show");
    });

    render();
  </script>
</body>
</html>
